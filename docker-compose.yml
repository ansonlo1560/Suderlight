version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suderlight
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - STORAGE_MODE=fs
      - API_PREFIX=/api
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-YOUR_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
    # 持久化玩家动态数据，静态模板由镜像提供
    volumes:
      - suderlight_saves:/app/server/data/saves
      - suderlight_memories:/app/server/data/memories

volumes:
  suderlight_saves:
  suderlight_memories:
